buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.11.1"
    }
}

plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'signing'
}

group = 'org.fosslight'
version = '2.0.0'

base {
    archivesName = 'android-dependency-scanning'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
}

def embeddedGroovyVersion = GroovySystem.version
def groovyGroup = embeddedGroovyVersion.startsWith('4.') ? 'org.apache.groovy' : 'org.codehaus.groovy'

dependencies {
    implementation gradleApi()
    implementation localGroovy()

    implementation "${groovyGroup}:groovy-xml:${embeddedGroovyVersion}"

    implementation 'org.yaml:snakeyaml:1.17'
    implementation 'org.apache.commons:commons-lang3:3.4'

    testImplementation 'junit:junit:4.13.2'
}

tasks.register('javadocJar', Jar) {
    dependsOn tasks.named('groovydoc')
    archiveClassifier.set('javadoc')
    from tasks.named('groovydoc').map { it.destinationDir }
}

publishing {
    publications.withType(MavenPublication).configureEach { publication ->
        if (publication.name == 'pluginMaven') {
            publication.groupId = project.group.toString()
            publication.artifactId = 'android-dependency-scanning'
            publication.version = project.version.toString()
            publication.artifact(tasks.named('javadocJar'))
        }

        pom {
            name = 'Android Dependency Scanning'
            description = 'Gradle plugin to analyze Android dependencies and generate the report.'
            url = 'https://github.com/fosslight/android-dependency-scanning'

            licenses {
                license {
                    name = 'Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    distribution = 'repo'
                }
            }

            developers {
                developer {
                    id = 'fosslight'
                    name = 'FOSSLight'
                    email = 'fosslight-dev@lge.com'
                }
            }

            scm {
                connection = 'scm:git:https://github.com/fosslight/android-dependency-scanning.git'
                developerConnection = 'scm:git:ssh://git@github.com/fosslight/android-dependency-scanning.git'
                url = 'https://github.com/fosslight/android-dependency-scanning'
            }
        }
    }

    repositories {
        maven {
            name = 'ossrh'

            def releasesRepositoryUrl =
                    findProperty('releasesRepositoryUrl')
                            ?: 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'

            def snapshotsRepositoryUrl =
                    findProperty('snapshotsRepositoryUrl')
                            ?: 'https://s01.oss.sonatype.org/content/repositories/snapshots/'

            url = uri(
                    project.version.toString().endsWith('-SNAPSHOT')
                            ? snapshotsRepositoryUrl
                            : releasesRepositoryUrl
            )

            credentials {
                username = findProperty('ossrhUsername')
                        ?: System.getenv('OSSRH_USERNAME')

                password = findProperty('ossrhPassword')
                        ?: System.getenv('OSSRH_PASSWORD')
            }
        }
    }
}

def signingKeyValue = findProperty('signingKey')
        ?: System.getenv('SIGNING_KEY')

def signingPasswordValue = findProperty('signingPassword')
        ?: System.getenv('SIGNING_PASSWORD')

def releaseVersion =
        !project.version.toString().endsWith('-SNAPSHOT')

signing {
    required = {
        releaseVersion && gradle.taskGraph.allTasks.any { task ->
            task.name.startsWith('publish') &&
                    task.name != 'publishToMavenLocal'
        }
    }

    if (signingKeyValue && signingPasswordValue) {
        useInMemoryPgpKeys(
                signingKeyValue.toString().replace('\\n', '\n'),
                signingPasswordValue.toString()
        )

        sign publishing.publications
    }
}
